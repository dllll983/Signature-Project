<div id="foot"></div>

<script>
/* Filet de sécurité : si la page reste vide, proposer de réparer au lieu d'un écran blanc */
setTimeout(function(){
  var a=document.getElementById('app'); if(!a||!a.querySelector('.spinner')) return;
  a.innerHTML='<div style="max-width:460px;margin:60px auto;padding:0 18px;text-align:center;font-family:sans-serif;color:#2b231c"><p style="margin-bottom:16px">Le chargement est trop long.<br>التحميل بطيء جدًا.</p><button id="fixbtn" style="padding:12px 22px;border-radius:99px;border:0;background:#c9a24d;color:#1b130a;font-size:16px">Réparer / إصلاح</button></div>';
  document.getElementById('fixbtn').onclick=function(){
    try{Object.keys(localStorage).filter(function(k){return /^sb-.*-auth-token/.test(k)}).forEach(function(k){localStorage.removeItem(k)})}catch(e){}
    try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})})}catch(e){}
    try{caches&&caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}catch(e){}
    setTimeout(function(){location.reload()},400);
  };
},20000);
</script>
